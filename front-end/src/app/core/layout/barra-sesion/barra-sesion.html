<header class="barra">
  <div class="barra__contenido">
    <a class="barra__marca" [routerLink]="rutaInicio()" aria-label="Ir al inicio" (click)="cerrarMenu()">
      <strong>FARO GESTIÓN</strong>
      <span>HOTEL &amp; ESTADÍAS</span>
    </a>

    <button
      type="button"
      class="barra__menu"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="navegacion-principal"
      (click)="cambiarMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="navegacion-principal"
      class="barra__navegacion"
      [class.barra__navegacion--abierta]="menuAbierto()"
      aria-label="Navegación principal"
    >
      @for (opcion of opciones(); track opcion.ruta) {
        <a
          [routerLink]="opcion.ruta"
          routerLinkActive="barra__enlace--activo"
          ariaCurrentWhenActive="page"
          (click)="cerrarMenu()"
        >
          {{ opcion.texto }}
        </a>
      }
    </nav>

    <div class="barra__acciones" [class.barra__acciones--abiertas]="menuAbierto()">
      <span class="barra__fecha">{{ fechaActual }}</span>

      @if (puedeReservar()) {
        <a class="barra__reserva" routerLink="/disponibilidad" (click)="cerrarMenu()">
          Nueva reserva
        </a>
      }

      <div class="barra__sesion">
        <div class="barra__avatar" aria-hidden="true">
          {{ inicialUsuario() }}
        </div>

        <div class="barra__usuario">
          <span>Sesión activa</span>
          <strong>{{ nombreUsuario() }}</strong>
        </div>

        <button type="button" class="barra__salir" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </div>
</header>
